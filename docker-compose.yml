version: "3.1"

services:
  postgres-notification:
    image: postgres:16
    container_name: notification_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - notification_db:/var/lib/postgresql/data
    networks:
      - kafka

volumes:
  notification_db:

networks:
  kafka:
    driver: bridge